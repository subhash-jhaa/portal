openapi: 3.0.3
info:
  title: Growmer provisional projects API
  version: 0.1.0
  description: PROVISIONAL. Replace or reconcile with the Python team's draft before integration.
servers:
  - url: /api
paths:
  /projects:
    get:
      operationId: getProjects
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
                  total:
                    type: integer
                    minimum: 0
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProject"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{id}:
    get:
      operationId: getProject
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    CreateProject:
      type: object
      required: [name, owner, description]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 80
        owner:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: string
          maxLength: 500
    Project:
      allOf:
        - $ref: "#/components/schemas/CreateProject"
        - type: object
          required: [id, status, createdAt]
          properties:
            id:
              type: string
            status:
              type: string
              enum: [active, planning, completed]
            createdAt:
              type: string
              format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
